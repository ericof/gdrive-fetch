name: CI

on:
  # Pushes to main plus every pull request. Filtering push to main is what
  # keeps a PR branch from running the whole suite twice for one commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# One run per branch or PR; a rapid second push cancels the first rather than
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  python-version: "3.14"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v9.0.0
          with:
            python-version: ${{ env.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Check formatting
          if: ${{ success() || failure() }}
          id: ruff-format
          run: uvx ruff@latest format --diff

        - name: Check lint
          if: ${{ success() || failure() }}
          id: ruff-lint
          # Not `--diff`: that only reports violations ruff can autofix and
          # exits 0 on the rest, so S608 and friends would pass silently.
          run: uvx ruff@latest check

        - name: Check typing
          if: ${{ success() || failure() }}
          id: typing
          run: |
            make lint-mypy

        - name: Test codebase
          if: ${{ success() || failure() }}
          id: tests
          run: |
            make test

        - name: Report
          if: ${{ success() || failure() }}
          run: |
            echo '# Code Analysis' >> $GITHUB_STEP_SUMMARY
            echo '| Test | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
            echo '| Format | ${{ steps.ruff-format.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Lint | ${{ steps.ruff-lint.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Typing | ${{ steps.typing.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Tests | ${{ steps.tests.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
