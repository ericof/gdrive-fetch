[project]
name = "gdrive-fetch"
version = "0.1.0"
description = "Authenticated, async, parallel downloader for private Google Drive folders (gdown-like)."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
gdrive-fetch = "gdrive_fetch.cli:main"

[project.urls]
Homepage = "https://github.com/ericof/gdrive-fetch"
Repository = "https://github.com/ericof/gdrive-fetch"
Issues = "https://github.com/ericof/gdrive-fetch/issues"
Changelog = "https://github.com/ericof/gdrive-fetch/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdrive_fetch"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "towncrier",]

[tool.uv]
managed = true
default-groups = ["dev"]

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/ericof/gdrive-fetch/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Feature"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfix"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py314"
line-length = 88
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are how tests assert; the fake Drive server uses them as invariants.
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.check-manifest]
ignore = []

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
